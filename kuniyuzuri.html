<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>国譲り神話とは何か｜岩戸ログ</title>
<meta name="theme-color" content="#3B2A8C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Maru+Gothic:wght@500;700;900&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF8EE; --card:#fff; --line:#F0E4D2;
  --ink:#2A2140; --dim:#6E6682;
  --purple:#5B3FD0; --orange:#F0703A; --gold:#E9B949;
  --grad:linear-gradient(100deg,#5B3FD0 0%,#A44BB8 50%,#F0703A 100%);
  --goldtx:linear-gradient(90deg,#FFE08A,#FFB25A 55%,#F58BA8);
  --night:#171236;
  --l1:#2E6BE6; --l2:#E58A12; --l3:#D94457;
  --round:'Zen Maru Gothic','M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;
  --serif:'Shippori Mincho','Hiragino Mincho ProN',serif;
  --mono:'IBM Plex Mono',monospace;
  --r:24px;
}
*{margin:0;padding:0;box-sizing:border-box}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--round);font-weight:500;line-height:1.8;font-size:15px;
  padding-bottom:calc(78px + env(safe-area-inset-bottom))}
a{color:var(--purple)}
img{max-width:100%}

/* ── ヘッダー ── */
.nav{position:sticky;top:0;z-index:40;background:rgba(255,248,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid #EFE3D2}
.nav-in{max-width:1080px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.7rem}
.logo{width:44px;height:44px;border-radius:13px;background:var(--grad);display:grid;place-items:center;flex-shrink:0;
  box-shadow:0 4px 12px rgba(91,63,208,.3)}
.logo svg{width:28px;height:28px}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1.2}
.brand span{font-size:.68rem;font-weight:700;color:var(--purple)}
.brand b{font-size:1.35rem;font-weight:900;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav-links{margin-left:auto;display:flex;gap:.4rem;flex-wrap:wrap;font-size:.8rem;justify-content:flex-end}
.nav-links a{color:var(--ink);text-decoration:none;font-weight:700;background:#fff;border:1.5px solid #EADBC6;border-radius:999px;padding:.2rem .8rem}
.nav-links a:hover{border-color:var(--purple);color:var(--purple)}
.nav-btn{margin-left:auto;display:none;width:42px;height:42px;border-radius:12px;border:1.5px solid #EADBC6;background:#fff;font-size:1.2rem;cursor:pointer}
@media(max-width:820px){.nav-links{display:none}.nav-btn{display:block}
  .nav.open .nav-links{display:flex;position:absolute;top:100%;left:0;right:0;background:var(--cream);padding:.8rem 1rem 1rem;border-bottom:1px solid #EFE3D2;justify-content:flex-start}}

/* ── ヒーロー ── */
.hero{position:relative;overflow:hidden;color:#fff;background:var(--night)}
.sky{position:absolute;inset:0;background:
  radial-gradient(900px 520px at 80% 10%,rgba(164,75,184,.55),transparent 60%),
  radial-gradient(700px 500px at 10% 30%,rgba(46,107,230,.45),transparent 60%),
  radial-gradient(600px 300px at 60% 95%,rgba(240,112,58,.45),transparent 70%),
  linear-gradient(180deg,#120E2E 0%,#241A5A 45%,#3B2470 75%,#5A2E6E 100%)}
.hero-photo{position:absolute;inset:0;background:url("img/hero.jpg") center 38%/cover no-repeat;opacity:.55}
#stars{position:absolute;inset:0;width:100%;height:100%}
.mount{position:absolute;left:0;right:0;bottom:0;width:100%;height:42%;min-height:180px}
.hero-dial{position:absolute;right:-6%;top:6%;opacity:.7;pointer-events:none;animation:spin 240s linear infinite}
.hero-dial svg{width:min(420px,78vw);height:auto;filter:drop-shadow(0 0 12px rgba(233,185,73,.55))}
@keyframes spin{to{transform:rotate(360deg)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,14,46,0) 30%,rgba(18,14,46,.55) 70%,rgba(18,14,46,.85) 100%);pointer-events:none}
.hero-in{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:2.2rem 1.2rem 2rem;display:flex;gap:2rem;flex-wrap:wrap;align-items:flex-end;min-height:min(86vh,760px)}
.hero-main{flex:1;min-width:280px}
.pill{display:inline-flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:.3rem 1rem .3rem .3rem;font-weight:700;font-size:.88rem}
.pill span{background:linear-gradient(90deg,#FFC24A,#F5852E);color:#3A1D00;border-radius:999px;padding:.05rem .8rem;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;letter-spacing:.08em}
.kicker{margin:1.2rem 0 .2rem;font-weight:700;opacity:.9}
.hero h1{font-family:var(--round);font-weight:900;font-size:clamp(2.1rem,9.5vw,3.6rem);line-height:1.25;letter-spacing:.02em;text-shadow:0 4px 18px rgba(0,0,0,.4)}
.hero h1 em{font-style:normal;display:block;background:var(--goldtx);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(0,0,0,.35))}
.hero-desc{font-size:.95rem;opacity:.93;max-width:32em;margin:1rem 0 1.2rem}
.searchbar{display:flex;max-width:520px;background:#fff;border-radius:999px;padding:.3rem;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.searchbar input{flex:1;min-width:0;padding:.7rem 1rem;border:none;border-radius:999px;font-family:var(--round);font-size:.92rem;color:var(--ink);background:transparent}
.searchbar input:focus{outline:none}
.searchbar button{padding:.7rem 1.4rem;border:none;border-radius:999px;background:var(--grad);color:#fff;font-family:var(--round);font-weight:900;letter-spacing:.1em;cursor:pointer;font-size:.95rem}
.hot-tags{margin-top:.9rem;font-size:.76rem;display:flex;gap:.45rem;flex-wrap:wrap;align-items:center;opacity:.95}
.hot-tags a{color:#fff;text-decoration:none;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.3);border-radius:999px;padding:.08rem .75rem;font-weight:700}
.hot-tags a:hover{background:rgba(255,255,255,.3)}
.cta-row{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:1.2rem}
.cta{display:inline-block;text-decoration:none;border-radius:999px;padding:.85rem 1.5rem;font-weight:900;font-size:1rem}
.cta.main{background:var(--grad);color:#fff;box-shadow:0 10px 26px rgba(164,75,184,.5)}
.cta.sub{background:rgba(255,255,255,.14);color:#fff;border:2px solid rgba(255,255,255,.55);backdrop-filter:blur(6px)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;margin-top:1.3rem;max-width:520px}
.stat{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);border-radius:18px;padding:.55rem .8rem;backdrop-filter:blur(6px)}
.stat small{display:block;font-size:.72rem;opacity:.85;font-weight:700}
.stat b{font-family:'M PLUS Rounded 1c',sans-serif;font-size:1.7rem;font-weight:800;line-height:1.2}
.stat b i{font-style:normal;font-size:.8rem;margin-left:2px}

.method-panel{width:320px;max-width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.28);border-radius:var(--r);padding:1.1rem 1.2rem;backdrop-filter:blur(8px)}
.method-panel h2{font-size:.98rem;font-weight:900;margin-bottom:.7rem}
.m-row{display:flex;gap:.65rem;margin-bottom:.6rem;font-size:.8rem;line-height:1.65;opacity:.95}
.m-row b{font-weight:900}
.lv{flex-shrink:0;font-family:'M PLUS Rounded 1c',sans-serif;font-size:.72rem;font-weight:800;color:#fff;border-radius:999px;padding:.02rem .6rem;height:fit-content}
.lv.l1{background:var(--l1)}.lv.l2{background:var(--l2)}.lv.l3{background:var(--l3)}

/* ── 共通 ── */
main{max-width:1080px;margin:0 auto;padding:1.4rem 1rem 2.4rem}
.panel{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);box-shadow:0 6px 18px rgba(120,90,50,.08);overflow:hidden}
.panel-h{font-weight:900;font-size:1.08rem;padding:.95rem 1.15rem .55rem;display:flex;align-items:center;gap:.4rem}
.panel-h .en{font-size:.72rem;color:var(--dim);font-weight:700;margin-left:auto}
.panel-b{padding:0 1.15rem 1rem;font-size:.84rem;color:#4B4560}
.panel-foot{display:block;margin:.4rem 1.15rem 1.1rem;padding:.6rem;text-align:center;font-size:.85rem;font-weight:900;
  border-radius:999px;text-decoration:none;color:#fff;background:var(--grad);box-shadow:0 6px 16px rgba(164,75,184,.3)}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;margin-top:.4rem}
@media(max-width:900px){.row3{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.row3{grid-template-columns:1fr}}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:1rem}
@media(max-width:1000px){.row4{grid-template-columns:1fr 1fr}}
@media(max-width:620px){.row4{grid-template-columns:1fr}}
.map{height:230px;background:#1d1640}
.leaflet-container{font-family:var(--round)}

/* 更新リスト */
.upd{list-style:none}
.upd li{padding:.6rem 1.15rem;border-top:1.5px dashed #F1E6D6}
.upd .u-top{display:flex;gap:.55rem;align-items:center}
.upd .u-date{font-family:var(--mono);font-size:.72rem;color:var(--dim)}
.upd .u-title{font-size:.88rem;font-weight:700;line-height:1.6;margin-top:.1rem}
.upd .u-title a{color:var(--ink);text-decoration:none}
.upd .u-title a:hover{color:var(--purple)}
.plan-tag{color:#fff;background:var(--orange);border-radius:999px;padding:0 .6em;font-size:.66rem;font-weight:900}

/* 見出し */
h2.sec{font-weight:900;font-size:1.55rem;margin:2.2rem 0 .3rem;display:flex;align-items:center;gap:.5rem}
h2.sec .ico{font-size:1.8rem}
h2.sec .en{font-family:var(--round);font-size:.95rem;font-weight:900;margin-left:auto;color:var(--purple)}
.sec-desc{color:var(--dim);margin-bottom:1rem;font-size:.92rem}

/* カテゴリカード */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
@media(min-width:760px){.cats{grid-template-columns:repeat(4,1fr)}}
.cat{text-decoration:none;color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:0 6px 18px rgba(120,90,50,.1);cursor:pointer;display:flex;flex-direction:column;transition:transform .2s}
.cat:active{transform:scale(.98)}
.cat-ph{position:relative;aspect-ratio:16/11;overflow:hidden;background:linear-gradient(160deg,#3B2A8C,#171236)}
.cat-ph::before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 30% 25%,rgba(255,255,255,.35) 0 1.5px,transparent 2px),
  radial-gradient(circle at 70% 60%,rgba(255,255,255,.3) 0 1px,transparent 1.5px),
  radial-gradient(circle at 85% 20%,rgba(255,255,255,.4) 0 1.5px,transparent 2px),
  radial-gradient(circle at 15% 75%,rgba(255,255,255,.3) 0 1px,transparent 1.5px)}
.g-tsuki{background:linear-gradient(160deg,#2B3F8E,#141A44)}
.g-shio{background:linear-gradient(160deg,#1E7FA6,#103352)}
.g-fuin{background:linear-gradient(160deg,#5A2E7A,#1E1236)}
.g-world{background:linear-gradient(160deg,#3B2A8C,#0E0B2A)}
.g-iwato{background:linear-gradient(160deg,#B4472E,#3A1420)}
.g-field{background:linear-gradient(160deg,#3E8A4E,#163220)}
.g-chiba{background:linear-gradient(160deg,#C77A22,#4A2410)}
.g-kami{background:linear-gradient(160deg,#8E2F5E,#2A0E22)}
.cat-ph .glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-weight:800;font-size:3.4rem;background:var(--goldtx);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,200,100,.45))}
.cat-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .25s}
.cat:hover .cat-ph img{transform:scale(1.05)}
.cat-badge{position:absolute;top:.55rem;left:.55rem;background:rgba(255,255,255,.92);color:var(--purple);border-radius:999px;padding:0 .65rem;font-size:.72rem;font-weight:900}
.cat-name{font-weight:900;font-size:1.02rem;padding:.65rem .9rem 0}
.cat-desc{font-size:.74rem;color:var(--dim);line-height:1.6;padding:.15rem .9rem .9rem}

/* タグ＋基準データ */
.tagrow{display:grid;grid-template-columns:2fr 1fr;gap:1rem;margin-top:1.6rem;align-items:start}
@media(max-width:820px){.tagrow{grid-template-columns:1fr}}
.tags-panel .t-line{display:flex;gap:.45rem;align-items:center;padding:.4rem 1.15rem;flex-wrap:wrap}
.t-k{font-size:.76rem;color:var(--dim);min-width:3.2em;font-weight:900}
.t-tag{font-size:.78rem;font-weight:700;color:var(--purple);background:#F1ECFF;border-radius:999px;padding:.12rem .8rem;cursor:pointer;border:none;font-family:var(--round)}
.t-tag:hover{background:var(--purple);color:#fff}
.t-tag.lv1{color:#fff;background:var(--l1)}.t-tag.lv2{color:#fff;background:var(--l2)}.t-tag.lv3{color:#fff;background:var(--l3)}
.base-photo{height:170px;background-image:linear-gradient(rgba(23,18,54,.1),rgba(23,18,54,.4)),url("img/amagi.jpg"),linear-gradient(160deg,#5B3FD0,#171236);background-size:cover;background-position:62% 55%;position:relative}
.base-row{display:flex;justify-content:space-between;font-size:.84rem;padding:.35rem 1.15rem;border-top:1.5px dashed #F1E6D6}
.base-row .k{color:var(--dim);font-weight:700}
.base-row .v{font-family:var(--mono);font-size:.8rem}

/* 検索結果 */
#searchSec{display:none;margin-top:.4rem}
#searchSec.on{display:block}
.report{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:1rem 1.2rem;margin-bottom:.8rem;box-shadow:0 6px 18px rgba(120,90,50,.08)}
.r-top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.r-date{font-family:var(--mono);font-size:.74rem;color:var(--dim)}
.r-title{font-weight:900;font-size:1.08rem;margin:.2rem 0 .3rem;line-height:1.55}
.r-body{font-size:.86rem;color:#3E3852}
.r-photos{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.r-photos figure{margin:0;width:106px}
.r-photos img{width:106px;height:80px;object-fit:cover;border-radius:12px;cursor:pointer;display:block}
.r-photos figcaption{font-size:.66rem;color:var(--dim);line-height:1.5;margin-top:.15rem}
.r-files{margin-top:.55rem;display:flex;gap:.55rem;flex-wrap:wrap}
.r-file{font-size:.78rem;font-weight:700;color:var(--purple);text-decoration:none;border:1.5px solid #E2D8FF;border-radius:999px;padding:.1rem .8rem;background:#F7F4FF}
.r-file::before{content:"📄 "}
.r-tags{margin-top:.55rem;display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}
.tag{font-size:.72rem;font-weight:700;padding:.04rem .65rem;border-radius:999px;background:#FFF0E3;color:var(--orange)}
.r-link{font-size:.8rem;font-weight:900;margin-left:auto;color:var(--purple);text-decoration:none}
.count{font-family:var(--mono);font-size:.76rem;color:var(--dim);margin:.2rem 0 .7rem}
.empty{padding:1.6rem;text-align:center;color:var(--dim);font-size:.88rem}

/* 現地調査 */
.fw-item{display:flex;gap:.75rem;padding:.65rem 1.15rem;border-top:1.5px dashed #F1E6D6;align-items:center}
.fw-th{width:72px;height:54px;border-radius:14px;flex-shrink:0;overflow:hidden;position:relative;
  background:linear-gradient(160deg,#3E8A4E,#163220);display:flex;align-items:center;justify-content:center}
.fw-th span{font-family:var(--serif);font-size:1.3rem;font-weight:800;color:#FFE08A}
.fw-th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fw-t{font-size:.84rem;font-weight:700;line-height:1.55}
.fw-t .d{font-family:var(--mono);font-size:.7rem;color:var(--dim);display:block;font-weight:500}

/* 地震ミニ表 */
.tbl{overflow-x:auto}
table.qk{width:100%;border-collapse:collapse;font-size:.78rem}
table.qk th{font-weight:900;color:var(--dim);text-align:left;padding:.45rem .5rem .45rem 1.15rem;background:#FFF6EA;white-space:nowrap}
table.qk td{padding:.45rem .5rem .45rem 1.15rem;border-bottom:1.5px dashed #F1E6D6;white-space:nowrap}
table.qk .m{font-family:var(--mono)}

/* ギャラリー */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;padding:0 1.15rem .5rem}
.gal figure{margin:0}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;cursor:pointer;display:block}
.gal figcaption{font-size:.66rem;color:var(--dim);line-height:1.5}
.gal-empty{padding:.4rem 1.15rem 1.1rem;font-size:.8rem;color:var(--dim)}

footer{background:var(--night);color:#B9B2D6;margin-top:2.4rem;padding:1.8rem 1.2rem 2.2rem;font-size:.8rem;border-radius:28px 28px 0 0}
.foot-in{max-width:1080px;margin:0 auto;display:flex;gap:1.1rem;flex-wrap:wrap;align-items:center}
.foot-in a{color:#E2DCF8;text-decoration:none;font-weight:700}
.foot-c{margin-left:auto;font-family:var(--mono);font-size:.7rem}

/* 下タブ・上へ */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(250,244,236,.96);backdrop-filter:blur(10px);border-top:1px solid #E8DCCB;padding:.35rem .2rem calc(.35rem + env(safe-area-inset-bottom))}
nav.tabs a{text-decoration:none;text-align:center;font-size:.7rem;font-weight:900;color:var(--dim);line-height:1.3}
nav.tabs a span{display:block;font-size:1.45rem}
nav.tabs a.on{color:var(--purple)}
.up{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:44;width:52px;height:52px;border-radius:50%;
  background:var(--grad);color:#fff;font-size:1.5rem;font-weight:900;display:grid;place-items:center;text-decoration:none;box-shadow:0 8px 20px rgba(140,60,180,.4)}
@media(min-width:900px){body{padding-bottom:0}nav.tabs,.up{display:none}}

.lightbox{position:fixed;inset:0;background:rgba(18,14,46,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:.7rem;z-index:60;padding:1rem;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:80vh;border-radius:14px}
.lb-cap{color:#E2DCF8;font-size:.85rem;text-align:center}
.lb-x{color:#9A92BA;font-size:.7rem;letter-spacing:.2em}

/* はじまり */
.story{display:grid;gap:1rem;margin-top:.6rem}
@media(min-width:820px){.story{grid-template-columns:1fr 1fr}}
.story-card{background:#fff;border-radius:var(--r);padding:1.2rem 1.25rem .4rem;border:3px solid transparent;
  background-image:linear-gradient(#fff,#fff),var(--grad);background-origin:border-box;background-clip:padding-box,border-box;box-shadow:0 10px 26px rgba(120,60,160,.12)}
.story-card.s2{background-image:linear-gradient(#fff,#fff),linear-gradient(100deg,#E9B949,#F0703A)}
.story-badge{display:inline-block;background:var(--goldtx);color:#4A2A00;font-weight:900;font-size:.8rem;border-radius:999px;padding:.08rem .85rem}
.story-card h2{font-size:1.35rem;font-weight:900;margin:.45rem 0 .4rem}
.story-card p{font-size:.93rem;margin-bottom:.55rem}
.story-card b{color:var(--purple)}
.story-q{font-weight:900;font-size:1.05rem;text-align:center;background:#F6F1FF;border-radius:16px;padding:.6rem .8rem;color:var(--ink)}
.story-note{font-size:.78rem!important;color:var(--dim)}
.story .panel-foot{margin:.6rem 0 1rem}
</style>
<style>
.ph{position:relative;overflow:hidden;color:#fff;background:linear-gradient(180deg,#120E2E,#3B2470)}
.ph-in{position:relative;max-width:820px;margin:0 auto;padding:2rem 1.2rem 2.2rem}
.ph .g{font-family:var(--serif);font-weight:800;font-size:4rem;line-height:1;background:var(--goldtx);-webkit-background-clip:text;background-clip:text;color:transparent}
.ph h1{font-size:clamp(1.7rem,7vw,2.6rem);font-weight:900;margin:.6rem 0 .4rem;line-height:1.35}
.ph p{opacity:.92;font-size:.95rem}
