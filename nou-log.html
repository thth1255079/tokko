<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>脳内書き換えログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sand: #f6f0dd;
    --sand-deep: #ece2c6;
    --sand-line: #d7c9a3;
    --ink: #26241d;
    --ink-soft: #5c5847;
    --ok: #4a6a4a;
    --white: #fffdf7;
    --panel: #29271f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--sand);
    font-family:'Zen Kaku Gothic New', sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  #root{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    padding:16px 14px 60px;
  }

  /* ===== 名前入力スクリーン ===== */
  .name-screen{
    min-height:80vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
  }
  .name-screen .brain-emoji{
    font-size:60px;
    margin-bottom:10px;
    filter:grayscale(100%) opacity(0.55);
  }
  .name-screen h1{
    font-family:'Shippori Mincho', serif;
    font-size:25px;
    margin:0 0 10px;
  }
  .name-screen p{
    color:var(--ink-soft);
    font-size:14px;
    line-height:1.85;
    max-width:380px;
    margin-bottom:22px;
  }
  .name-input-row{
    display:flex;
    gap:8px;
    width:100%;
    max-width:340px;
  }
  #nameInput{
    flex:1;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:16px;
    padding:13px 14px;
    border:2px solid var(--sand-line);
    border-radius:10px;
    background:var(--white);
    color:var(--ink);
  }
  #nameInput:focus{ outline:2px solid #b7845f; }
  #startBtn{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14.5px;
    padding:13px 18px;
    border:none;
    border-radius:10px;
    background:var(--ink);
    color:var(--white);
    cursor:pointer;
    white-space:nowrap;
  }

  /* ===== メイン画面 ===== */
  header.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  header.top .who{
    font-size:13px;
    color:var(--ink-soft);
  }
  header.top .who b{ color:var(--ink); }
  .rename{
    font-size:11.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
  }

  /* 資源バー(石ころ) */
  .resource-bar{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--sand-deep);
    border:1.5px solid var(--sand-line);
    border-radius:20px;
    padding:6px 14px 6px 6px;
    margin-bottom:12px;
    width:fit-content;
  }
  .resource-icon{
    width:30px;height:30px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #b7b0a0, #6b6557);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    box-shadow:inset 0 -2px 3px rgba(0,0,0,0.25);
    flex:none;
  }
  .resource-count{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:16px;
    color:var(--ink);
  }
  .resource-label{
    font-size:10.5px;
    color:var(--ink-soft);
    margin-left:2px;
  }

  /* ドット絵の脳 */
  .pixel-brain{
    flex:none;
    display:grid;
    grid-template-columns:repeat(10, 1fr);
    gap:1.5px;
    width:78px;
    height:64px;
  }
  .pixel-cell{
    border-radius:1.5px;
    background:transparent;
    transition:background .35s ease;
  }
  .pixel-cell.mask{ background:#413d30; }
  .pixel-cell.filled{ box-shadow:0 0 3px rgba(246,211,77,0.5); }

  /* タブ:横スクロールチップ */
  .tabs{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:12px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex:none;
    background:var(--white);
    border:1.5px solid var(--sand-line);
    border-radius:20px;
    padding:8px 14px;
    text-align:center;
    cursor:pointer;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
    white-space:nowrap;
  }
  .tab.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--white);
  }

  /* 脳パネル */
  .brain-panel{
    background:var(--panel);
    color:var(--white);
    border-radius:16px;
    padding:16px 16px 14px;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:14px;
  }
  .brain-visual{
    flex:none;
    width:64px;height:64px;
    display:flex;align-items:center;justify-content:center;
    font-size:46px;
    position:relative;
    transition:filter .5s ease;
  }
  .brain-visual::after{
    content:"";
    position:absolute;
    inset:-10px;
    border-radius:50%;
    z-index:-1;
    filter:blur(14px);
    opacity:0.55;
    transition:background .5s ease;
  }
  .brain-info{ flex:1; min-width:0; }
  .brain-toprow{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:4px;
  }
  .brain-cat{
    font-size:11.5px;
    letter-spacing:0.06em;
    color:#c9c2ab;
  }
  .brain-exp{
    font-family:'Shippori Mincho', serif;
    font-size:19px;
    font-weight:700;
    color:#f0c9b4;
  }
  .exp-bar-track{
    height:7px;
    background:rgba(255,255,255,0.15);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:8px;
  }
  .exp-bar-fill{
    height:100%;
    border-radius:4px;
    transition:width .4s ease, background .5s ease;
    width:0%;
  }
  .log-line{
    font-family:'Shippori Mincho', serif;
    font-size:15.5px;
    line-height:1.6;
    transition:opacity .25s ease;
  }
  .log-line.fade{ opacity:0; }
  .log-line .name{
    color:#f0c9b4;
    font-weight:700;
  }
  .murmur{
    margin-top:4px;
    font-size:11.5px;
    color:#a9a190;
    line-height:1.6;
  }

  /* 裁判官(縮んでいく) */
  .judge-slot{
    flex:none;
    width:46px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    gap:3px;
  }
  .judge-visual{
    font-size:34px;
    line-height:1;
    transition:transform .5s ease, opacity .5s ease;
    transform-origin:center bottom;
  }
  .judge-caption{
    font-size:9px;
    color:#a9a190;
    text-align:center;
    line-height:1.4;
  }

  /* RPG風・入手メッセージ */
  .rpg-box{
    background:#111;
    border:2px solid var(--white);
    box-shadow: 0 0 0 1px #111 inset, 3px 3px 0 rgba(0,0,0,0.25);
    border-radius:2px;
    padding:12px 14px;
    margin:10px 0 14px;
    color:#fff;
    font-size:14.5px;
    line-height:1.8;
    letter-spacing:0.03em;
    animation: rpgIn .25s ease;
  }
  .rpg-box .arrow{
    float:right;
    animation: rpgBlink 1s steps(1) infinite;
  }
  @keyframes rpgIn{
    from{ opacity:0; transform:translateY(-4px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes rpgBlink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0; }
  }

  /* 目的(折りたたみ) */
  .target-toggle{
    font-size:12.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    margin:0 0 10px 2px;
    display:inline-block;
  }
  .target-box{
    background:var(--sand-deep);
    border:1px solid var(--sand-line);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:12px;
    font-size:13.5px;
    line-height:1.75;
    color:var(--ink-soft);
    display:none;
  }
  .target-box.open{ display:block; }
  .target-box b{ color:var(--ink); }

  /* Day リスト:コンパクト */
  .day-list{
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .day-row{
    display:flex;
    align-items:center;
    gap:11px;
    background:var(--white);
    border:1.5px solid var(--sand-line);
    border-radius:11px;
    padding:11px 13px;
    cursor:pointer;
  }
  .day-row.done{
    background:#eef3ea;
    border-color:#b7cbb0;
  }
  .day-num{
    font-family:'Shippori Mincho', serif;
    font-size:12px;
    color:var(--ink-soft);
    min-width:36px;
    text-align:center;
    flex:none;
  }
  .day-row.done .day-num{ color:var(--ok); font-weight:700; }

  .checkbox{
    width:25px;height:25px;
    border-radius:7px;
    border:2px solid var(--sand-line);
    flex:none;
    display:flex;align-items:center;justify-content:center;
    font-size:15px;
    color:transparent;
  }
  .day-row.done .checkbox{
    background:var(--ok);
    border-color:var(--ok);
    color:var(--white);
  }

  .day-text{
    font-size:15px;
    line-height:1.5;
    flex:1;
  }
  .day-row.done .day-text{ color:var(--ink-soft); }

  .footer-note{
    text-align:center;
    margin-top:18px;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.8;
  }

  /* ===== 活動カレンダー ===== */
  .cal-toggle{
    font-size:12.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    cursor:pointer;
    margin:0 0 10px 2px;
    display:inline-block;
  }
  .cal-section{
    background:var(--white);
    border:1.5px solid var(--sand-line);
    border-radius:12px;
    padding:14px 14px 12px;
    margin-bottom:12px;
    display:none;
  }
  .cal-section.open{ display:block; }
  .cal-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .cal-title{
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .cal-summary{
    font-family:'Shippori Mincho', serif;
    font-size:13px;
    color:var(--ink-soft);
  }
  .cal-summary b{ color:var(--ink); font-size:15px; }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    gap:4px;
  }
  .cal-dow{
    text-align:center;
    font-size:10px;
    color:var(--ink-soft);
    padding-bottom:2px;
  }
  .cal-cell{
    aspect-ratio:1/1;
    border-radius:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:10.5px;
    color:var(--ink-soft);
    background:var(--sand-deep);
    position:relative;
  }
  .cal-cell.empty-slot{ background:transparent; }
  .cal-cell.today{ box-shadow: 0 0 0 2px var(--ink) inset; font-weight:700; color:var(--ink); }
  .cal-cell.lv1{ background:#f0e2b8; color:#6b5a2c; }
  .cal-cell.lv2{ background:#e8c96a; color:#4a3c17; }
  .cal-cell.lv3{ background:#e0a838; color:#fff; font-weight:700; }
  .cal-cell.lv4{ background:#f6d34d; color:#4a3c17; font-weight:700; box-shadow:0 0 6px rgba(246,211,77,0.7); }
  .reset-btn{
    display:block;
    margin:16px auto 0;
    background:none;
    border:1px solid var(--sand-line);
    color:var(--ink-soft);
    font-size:12px;
    padding:7px 16px;
    border-radius:20px;
    cursor:pointer;
    font-family:'Zen Kaku Gothic New', sans-serif;
  }
  .complete-banner{
    text-align:center;
    background:var(--panel);
    color:var(--white);
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
    font-family:'Shippori Mincho', serif;
    font-size:14px;
    line-height:1.8;
  }
  .complete-banner .name{ color:#f0c9b4; font-weight:700; }
</style>
</head>
<body>
<div id="root"></div>

<script>
const CATEGORIES = [
  {
    key: "saving", icon:"貯", title:"貯金編",
    lead:"「お金がない＝不幸」の呪縛を解く7日間",
    target:"貯金額を一気に増やすことではなく、<b>「貯金＝我慢・修行」という結びつき</b>を外すこと。",
    days: [
      { text:"銀行口座の残高を、ただ見た", quip:"……見ただけだが、確かに見たのは事実だな" },
      { text:"コンビニのレジ前で、財布を開く前に3秒待った", quip:"3秒待った……それだけか。いや、待ったのは待ったな" },
      { text:"使わなかった100円を、貯金箱に入れた", quip:"チャリン、と音がしたのは認めよう" },
      { text:"サブスクの一覧画面を、1つだけ開いてみた", quip:"見ただけで解約はしていない。だが、見たのは見た" },
      { text:"買おうか迷っている画面を、閉じた", quip:"……閉じたな。今、確かに閉じた" },
      { text:"今月の固定費を、1件だけメモに書き出した", quip:"1件だけか。1件は1件だ" },
      { text:"口座の数字を、もう一度見た", quip:"7日間、毎回見に来たな……もう、いい。認める" },
    ]
  },
  {
    key: "spending", icon:"節", title:"節約編",
    lead:"マーケティングの誘惑を「観察対象」に変える7日間",
    target:"我慢することではなく、<b>「誘惑の仕組みを見抜く側」に立つこと</b>。",
    days: [
      { text:"「あと〇時間」の表示を見て、そのまま画面を閉じた", quip:"タイムセールの罠を無視したか……閉じたのは事実だな" },
      { text:"おすすめ広告が出た瞬間、「なるほど」と一言だけ思った", quip:"分析されて、分析し返したわけか。生意気だな" },
      { text:"カートに入れたものを、1つだけ削除した", quip:"……削除した。うん、削除は削除だ" },
      { text:"「今すぐ買う」ボタンの上で、1秒だけ止まった", quip:"押さなかったのは、確かに押さなかった" },
      { text:"松竹梅の価格表示を見て、一番安い方を指でなぞった", quip:"竹に誘導されなかったか。……認める" },
      { text:"不安を煽る記事のタイトルを見て、閉じた", quip:"煽り文句に釣られなかったな……閉じたのは見た" },
      { text:"今週買わなかったものを、1つだけ思い出した", quip:"思い出せる余裕があったわけか。……悔しいが認める" },
    ]
  },
  {
    key: "diet", icon:"食", title:"ダイエット編",
    lead:"我慢ゼロで体重の呪縛を解く7日間",
    target:"食事量や体重の結果ではなく、<b>「食べる＝失敗」という思い込み</b>を外すこと。",
    days: [
      { text:"一口目を、10回だけ噛んだ", quip:"10回か。数えたのは事実だな" },
      { text:"体重計の上に、片足だけ乗せて下りた", quip:"……片足で終わったのか。だが、乗ったのは乗った" },
      { text:"水を1杯だけ、いつもより多く飲んだ", quip:"1杯多く。水を疑う理由がない。認める" },
      { text:"スクワットの姿勢をとって、1センチだけ膝を曲げた", quip:"運動とは言えないが、膝を曲げたのは事実だな" },
      { text:"お菓子の袋を開ける前に、5秒だけ止まった", quip:"5秒の静止。止まったのは見た" },
      { text:"階段の前で、1段だけ上った", quip:"1段。たった1段だが、上ったのは上った" },
      { text:"今日食べたものを、評価せずに1行だけメモした", quip:"評価なしのメモか……潔いな。認めよう" },
    ]
  },
  {
    key: "room", icon:"室", title:"部屋掃除編",
    lead:"「片付けられない」の罪悪感を消す7日間",
    target:"部屋を一気に綺麗にすることではなく、<b>「散らかっている＝自分はダメ」という結びつき</b>を外すこと。",
    days: [
      { text:"床に落ちているゴミを、手で1個拾った", quip:"……いや、拾ったよね？" },
      { text:"机の上のペンを1本、ペン立てに挿した", quip:"ペン1本。だが、挿したのは挿した" },
      { text:"脱ぎっぱなしの服を、ベッドの端に寄せた", quip:"寄せただけで畳んではいない。だが、動かしたのは見た" },
      { text:"ゴミ箱のフタを開けて閉めた", quip:"開けて閉めた……それだけでも行動だ" },
      { text:"いらないプリントを1枚、破ってゴミ箱に入れた", quip:"1枚か。1枚は1枚だ。処理された" },
      { text:"本を1冊、本棚に戻した", quip:"1冊、正しい場所に戻ったわけか。認める" },
      { text:"机の上を、写真で1枚撮った", quip:"記録を残したな……証拠能力は高い" },
    ]
  },
  {
    key: "morning", icon:"朝", title:"早寝早起き編",
    lead:"「朝起きられない」の罪悪感を消す7日間",
    target:"起床時間そのものではなく、<b>「起きられなかった朝の激しい落ち込み」</b>をなくすこと。",
    days: [
      { text:"アラームが鳴った瞬間、布団の中で目を開けた", quip:"目を開けた……開けたのは開けた" },
      { text:"布団の中で、深呼吸を1回した", quip:"深呼吸1回。覚醒への一歩、と言えなくもない" },
      { text:"寝返りを打って、体を180度回転させた", quip:"回転しただけだが……動いたのは動いた" },
      { text:"布団から片手（または片足）だけ外に出した", quip:"片手だけか。だが、外に出たのは出た" },
      { text:"体を起こして、ベッドの上に1秒だけ座った", quip:"1秒でも座ったのは座った" },
      { text:"カーテンを、1センチだけ開けた", quip:"1センチの光。……それは前進だ" },
      { text:"起きた時間を、評価せずに1回だけメモした", quip:"評価なしか。潔い。今日は、これでいい" },
    ]
  },
  {
    key: "study", icon:"学", title:"勉強編",
    lead:"「勉強しなきゃ」の重さを外す7日間",
    target:"勉強時間の長さではなく、<b>「机に向かう＝苦痛」という結びつき</b>を外すこと。",
    days: [
      { text:"参考書を開いて、目次だけ見た", quip:"……開いたのは開いたな" },
      { text:"ノートに、日付だけ書いた", quip:"日付だけか。だが、ペンは動いた" },
      { text:"問題を1問だけ、解こうとしてみた", quip:"正解不問、と言うことは挑戦はしたわけか" },
      { text:"机の上に、ペンを1本置いた", quip:"置いただけだが……準備は準備だ" },
      { text:"教科書を1ページだけめくった", quip:"1ページ。めくったのはめくった" },
      { text:"昨日のノートを、1回だけ見返した", quip:"見返したのか……復習と呼んでもいいくらいだ" },
      { text:"明日開く参考書を、机の上に置いておいた", quip:"明日への布石か……今日はここまで認めよう" },
    ]
  },
];

const NAME_KEY = "brain-log:name";
const STORAGE_PREFIX = "brain-log:progress:";
const CHECKINS_KEY = "brain-log:checkins";

let state = {
  name: null,
  activeKey: CATEGORIES[0].key,
  progress: {},
  lastChecked: null,
  targetOpen: false,
  calOpen: false,
  checkins: {}, // { "YYYY-MM-DD": count }
};
CATEGORIES.forEach(c => { state.progress[c.key] = new Array(c.days.length).fill(false); });

function todayStr(d = new Date()){
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

async function loadCheckins(){
  try{
    const raw = localStorage.getItem(CHECKINS_KEY);
    if(raw){ const obj = JSON.parse(raw); if(obj && typeof obj === 'object') state.checkins = obj; }
  }catch(e){}
}
async function saveCheckins(){
  try{ localStorage.setItem(CHECKINS_KEY, JSON.stringify(state.checkins)); }catch(e){}
}
async function recordCheckin(delta){
  const key = todayStr();
  const cur = state.checkins[key] || 0;
  const next = Math.max(0, cur + delta);
  if(next === 0){ delete state.checkins[key]; } else { state.checkins[key] = next; }
  await saveCheckins();
}


async function loadName(){
  try{ const val = localStorage.getItem(NAME_KEY); if(val) return val; }catch(e){}
  return null;
}
async function saveName(name){ try{ localStorage.setItem(NAME_KEY, name); }catch(e){} }
async function loadProgress(key){
  try{
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    if(raw){ const arr = JSON.parse(raw); if(Array.isArray(arr)) state.progress[key] = arr; }
  }catch(e){}
}
async function saveProgress(key){
  try{ localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(state.progress[key])); }catch(e){}
}
function getCategory(key){ return CATEGORIES.find(c => c.key === key); }
function escapeHtml(str){ const div = document.createElement("div"); div.textContent = str; return div.innerHTML; }

// 進捗(0〜1)に応じて色を段階補間する: 灰色 → 金 → 珊瑚色
function lerp(a,b,t){ return Math.round(a + (b-a)*t); }
function hexToRgb(hex){
  const v = hex.replace('#','');
  return [parseInt(v.substr(0,2),16), parseInt(v.substr(2,2),16), parseInt(v.substr(4,2),16)];
}
function rgbToHex(r,g,b){ return '#' + [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

function levelClass(count){
  if(!count) return '';
  if(count === 1) return 'lv1';
  if(count <= 3) return 'lv2';
  if(count <= 5) return 'lv3';
  return 'lv4';
}

// ドット絵の脳:10列×8行のマスク(1=脳の形の一部)
const BRAIN_MASK = [
  "0011111100",
  "0111111110",
  "1111011111",
  "1111011111",
  "1111111111",
  "0111111110",
  "0011111100",
  "0000110000",
];
const BRAIN_CELLS = (() => {
  const cells = [];
  BRAIN_MASK.forEach((row, r) => {
    row.split('').forEach((ch, c) => {
      if (ch === '1') cells.push({ r, c });
    });
  });
  return cells;
})();

function buildPixelBrainHtml(ratio, color){
  const total = BRAIN_CELLS.length;
  const filledCount = Math.round(ratio * total);
  const cols = 10, rows = BRAIN_MASK.length;
  const grid = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) grid.push(null);

  BRAIN_CELLS.forEach((cell, i) => {
    const idx = cell.r * cols + cell.c;
    grid[idx] = i < filledCount ? 'filled' : 'mask';
  });

  return `<div class="pixel-brain">${grid.map(state =>
    state === 'filled'
      ? `<div class="pixel-cell mask filled" style="background:${color};"></div>`
      : state === 'mask'
        ? `<div class="pixel-cell mask"></div>`
        : `<div class="pixel-cell"></div>`
  ).join('')}</div>`;
}

function buildCalendarHtml(){
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth(); // 0-index
  const firstDow = new Date(year, month, 1).getDay(); // 0=日
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayKey = todayStr(now);

  let totalDays = 0, totalChecks = 0;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const c = state.checkins[key] || 0;
    if (c > 0) { totalDays++; totalChecks += c; }
  }

  const dows = ['日','月','火','水','木','金','土'];
  let cells = dows.map(w => `<div class="cal-dow">${w}</div>`).join('');
  for (let i = 0; i < firstDow; i++) cells += `<div class="cal-cell empty-slot"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const key = year + '-' + String(month+1).padStart(2,'0') + '-' + String(d).padStart(2,'0');
    const count = state.checkins[key] || 0;
    const isToday = key === todayKey;
    cells += `<div class="cal-cell ${levelClass(count)} ${isToday ? 'today' : ''}">${d}</div>`;
  }

  return `
    <div class="cal-toggle" id="calToggle">${state.calOpen ? 'カレンダーを閉じる ▲' : `カレンダーを見る（今月 ${totalDays}日 記録） ▼`}</div>
    <div class="cal-section ${state.calOpen ? 'open' : ''}">
      <div class="cal-head">
        <div class="cal-title">${year}年${month+1}月の記録</div>
        <div class="cal-summary">行動した日 <b>${totalDays}</b>日／のべ <b>${totalChecks}</b>回</div>
      </div>
      <div class="cal-grid">${cells}</div>
    </div>
  `;
}
function progressColor(ratio){
  const dull   = hexToRgb('#8f8877'); // くすんだ灰色(0日目)
  const amber  = hexToRgb('#e0a838'); // 温かい黄金色(中間)
  const bright = hexToRgb('#f6d34d'); // 明るい黄色(7日目)
  let t, c1, c2;
  if(ratio <= 0.5){ t = ratio / 0.5; c1 = dull; c2 = amber; }
  else { t = (ratio - 0.5) / 0.5; c1 = amber; c2 = bright; }
  const r = lerp(c1[0], c2[0], t), g = lerp(c1[1], c2[1], t), b = lerp(c1[2], c2[2], t);
  return rgbToHex(r,g,b);
}

function renderNameScreen(){
  const root = document.getElementById("root");
  root.innerHTML = `
    <div class="name-screen">
      <div class="brain-emoji">🧠</div>
      <h1>脳内書き換えログ</h1>
      <p>名前を入れると、小さな行動が三人称の記録として<br>
      淡々と積み上がっていきます。<br>
      行動が増えるほど、脳の色が少しずつ変わっていきます。<br>
      良い・悪いの判定は、ここにはありません。</p>
      <div class="name-input-row">
        <input id="nameInput" type="text" placeholder="名前（ニックネームでOK）" maxlength="12" />
        <button id="startBtn">はじめる</button>
      </div>
    </div>
  `;
  document.getElementById("startBtn").addEventListener("click", async () => {
    const val = document.getElementById("nameInput").value.trim();
    state.name = val || "名もなき人";
    await saveName(state.name);
    await Promise.all([...CATEGORIES.map(c => loadProgress(c.key)), loadCheckins()]);
    renderMain();
  });
  document.getElementById("nameInput").addEventListener("keydown", (e) => {
    if(e.key === "Enter") document.getElementById("startBtn").click();
  });
}

function renderMain(){
  const root = document.getElementById("root");
  const cat = getCategory(state.activeKey);
  const progress = state.progress[cat.key];
  const doneCount = progress.filter(Boolean).length;
  const total = cat.days.length;
  const ratio = doneCount / total;
  const allDone = doneCount === total;
  const name = state.name;
  const color = progressColor(ratio);
  const totalStones = Object.values(state.checkins).reduce((a, b) => a + b, 0);

  const lastIdx = state.lastChecked && state.lastChecked.key === cat.key ? state.lastChecked.idx : null;
  let logHtml, murmurHtml;
  if (lastIdx !== null) {
    logHtml = `<span class="name">${escapeHtml(name)}</span>は、${escapeHtml(cat.days[lastIdx].text)}。`;
    murmurHtml = escapeHtml(cat.days[lastIdx].quip);
  } else {
    logHtml = `<span class="name">${escapeHtml(name)}</span>は、まだ何も記録していない。`;
    murmurHtml = "……何か起きたら、教えてくれ。";
  }

  // 裁判官は、記録が増えるほど縮んでいく
  const judgeScale = Math.max(0.16, 1 - ratio * 0.84);
  const judgeOpacity = Math.max(0.35, 1 - ratio * 0.55);
  const judgeCaption = allDone ? "……無言" : (ratio === 0 ? "裁判官" : `${Math.round((1 - ratio) * 100)}%`);

  const rpgBoxHtml = (lastIdx !== null) ? `
    <div class="rpg-box">
      ${escapeHtml(name)}の　<b>裁判官</b>は　すこし　ちいさくなった！<span class="arrow">▼</span>
    </div>
  ` : '';

  root.innerHTML = `
    <header class="top">
      <div class="who"><b>${escapeHtml(name)}</b> の記録</div>
      <div class="rename" id="renameLink">名前を変更</div>
    </header>

    <div class="resource-bar">
      <div class="resource-icon">🪨</div>
      <div class="resource-count">${totalStones}</div>
      <div class="resource-label">積み上げた石ころ</div>
    </div>

    <div class="tabs">
      ${CATEGORIES.map(c => `
        <div class="tab ${c.key === state.activeKey ? 'active' : ''}" data-key="${c.key}">${c.icon} ${c.title}</div>
      `).join('')}
    </div>

    ${allDone ? `
      <div class="complete-banner">
        <span class="name">${escapeHtml(name)}</span>の7日分のログが揃った。裁判官は、ついに何も言えなくなった。
      </div>
    ` : ''}

    <div class="brain-panel">
      ${buildPixelBrainHtml(ratio, color)}
      <div class="brain-info">
        <div class="brain-toprow">
          <div class="brain-cat">${cat.title}</div>
          <div class="brain-exp" style="color:${color}">+${doneCount}</div>
        </div>
        <div class="exp-bar-track">
          <div class="exp-bar-fill" style="width:${ratio*100}%; background:${color};"></div>
        </div>
        <div class="log-line" id="logLine">${logHtml}</div>
        <div class="murmur">${murmurHtml}</div>
      </div>
      <div class="judge-slot">
        <div class="judge-visual" style="transform:scale(${judgeScale}); opacity:${judgeOpacity};">🧑‍⚖️</div>
        <div class="judge-caption">${judgeCaption}</div>
      </div>
    </div>

    ${rpgBoxHtml}

    ${buildCalendarHtml()}

    <div class="target-toggle" id="targetToggle">${state.targetOpen ? 'このシートの目的を閉じる ▲' : 'このシートの目的を見る ▼'}</div>
    <div class="target-box ${state.targetOpen ? 'open' : ''}">${cat.lead}<br><br>${cat.target}</div>

    <div class="day-list">
      ${cat.days.map((d, i) => `
        <div class="day-row ${progress[i] ? 'done' : ''}" data-idx="${i}">
          <div class="day-num">DAY${i + 1}</div>
          <div class="checkbox">✓</div>
          <div class="day-text">${escapeHtml(d.text)}</div>
        </div>
      `).join('')}
    </div>

    <button class="reset-btn" id="resetBtn">このシートをリセット</button>
    <div class="footer-note">判定はしません。発生した事実だけが、静かに記録されます。</div>
  `;

  // 光彩(glow)を疑似要素へ反映
  const visual = root.querySelector('.brain-visual');
  if (visual) visual.style.setProperty('--dummy', '0');
  const styleTag = document.getElementById('dynamicGlow') || (() => {
    const s = document.createElement('style'); s.id = 'dynamicGlow'; document.head.appendChild(s); return s;
  })();
  styleTag.textContent = `.brain-visual::after{ background:${color}; }`;

  root.querySelectorAll(".tab").forEach(el => {
    el.addEventListener("click", async () => {
      const key = el.getAttribute("data-key");
      if (!state.progress[key]) return;
      state.activeKey = key;
      state.lastChecked = null;
      await loadProgress(key);
      renderMain();
    });
  });

  root.querySelectorAll(".day-row").forEach(el => {
    el.addEventListener("click", async () => {
      const idx = parseInt(el.getAttribute("data-idx"), 10);
      const cat = getCategory(state.activeKey);
      const wasChecked = state.progress[cat.key][idx];
      state.progress[cat.key][idx] = !wasChecked;
      state.lastChecked = !wasChecked ? { key: cat.key, idx } :
        (state.lastChecked && state.lastChecked.idx === idx ? null : state.lastChecked);
      await saveProgress(cat.key);
      await recordCheckin(!wasChecked ? 1 : -1);
      renderMain();
    });
  });

  document.getElementById("resetBtn").addEventListener("click", async () => {
    const cat = getCategory(state.activeKey);
    state.progress[cat.key] = new Array(cat.days.length).fill(false);
    state.lastChecked = null;
    await saveProgress(cat.key);
    renderMain();
  });

  document.getElementById("renameLink").addEventListener("click", () => {
    renderNameScreen();
  });

  document.getElementById("targetToggle").addEventListener("click", () => {
    state.targetOpen = !state.targetOpen;
    renderMain();
  });

  document.getElementById("calToggle").addEventListener("click", () => {
    state.calOpen = !state.calOpen;
    renderMain();
  });
}

async function init(){
  const root = document.getElementById("root");
  root.innerHTML = `<div class="name-screen"></div>`;
  const savedName = await loadName();
  if (savedName) {
    state.name = savedName;
    await Promise.all([...CATEGORIES.map(c => loadProgress(c.key)), loadCheckins()]);
    renderMain();
  } else {
    renderNameScreen();
  }
}
init();
</script>
</body>
</html>
