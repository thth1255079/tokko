<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>岩戸ログ｜地震と方位の記録</title>
<meta name="description" content="天城16方位モデルによる地震観測ログ。震源方位と対応神を三層構造（L1/L2/L3）で記録するアーカイブ。">
<meta name="theme-color" content="#3B2A8C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Maru+Gothic:wght@500;700;900&family=Shippori+Mincho:wght@700;800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF8EE; --card:#fff; --line:#F0E4D2;
  --ink:#2A2140; --dim:#6E6682;
  --purple:#5B3FD0; --orange:#F0703A; --gold:#E9B949; --red:#D94457;
  --grad:linear-gradient(100deg,#5B3FD0 0%,#A44BB8 50%,#F0703A 100%);
  --goldtx:linear-gradient(90deg,#FFE08A,#FFB25A 55%,#F58BA8);
  --night:#171236;
  --round:'Zen Maru Gothic','M PLUS Rounded 1c','Hiragino Maru Gothic ProN',sans-serif;
  --serif:'Shippori Mincho','Hiragino Mincho ProN',serif;
  --mono:'IBM Plex Mono',monospace;
  --r:24px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{background:var(--cream);color:var(--ink);font-family:var(--round);font-weight:500;line-height:1.85;font-size:15.5px;
  padding-bottom:calc(78px + env(safe-area-inset-bottom))}

/* ヘッダー */
.nav{position:sticky;top:0;z-index:40;background:rgba(255,248,238,.92);backdrop-filter:blur(10px);border-bottom:1px solid #EFE3D2}
.nav-in{max-width:960px;margin:0 auto;padding:.55rem 1rem;display:flex;align-items:center;gap:.7rem}
.logo{width:44px;height:44px;border-radius:13px;background:var(--grad);display:grid;place-items:center;flex-shrink:0;box-shadow:0 4px 12px rgba(91,63,208,.3)}
.logo svg{width:28px;height:28px}
.brand{display:flex;flex-direction:column;text-decoration:none;line-height:1.2}
.brand span{font-size:.68rem;font-weight:700;color:var(--purple)}
.brand b{font-size:1.35rem;font-weight:900;letter-spacing:.06em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hbtn{margin-left:auto;text-decoration:none;font-weight:900;font-size:.82rem;color:var(--purple);background:#fff;border:1.5px solid #EADBC6;border-radius:999px;padding:.3rem .9rem}

/* ヒーロー＋方位盤 */
.hero{position:relative;overflow:hidden;color:#fff;background:var(--night)}
.sky{position:absolute;inset:0;background:
  radial-gradient(800px 480px at 85% 15%,rgba(164,75,184,.55),transparent 60%),
  radial-gradient(700px 480px at 5% 35%,rgba(46,107,230,.45),transparent 60%),
  radial-gradient(600px 300px at 50% 100%,rgba(240,112,58,.4),transparent 70%),
  linear-gradient(180deg,#120E2E 0%,#241A5A 50%,#3B2470 100%)}
#stars{position:absolute;inset:0;width:100%;height:100%}
.hero-in{position:relative;z-index:2;max-width:960px;margin:0 auto;padding:1.8rem 1.2rem 2.2rem}
.pill{display:inline-flex;align-items:center;gap:.6rem;background:rgba(255,255,255,.14);backdrop-filter:blur(8px);
  border:1.5px solid rgba(255,255,255,.35);border-radius:999px;padding:.3rem 1rem .3rem .3rem;font-weight:700;font-size:.85rem}
.pill span{background:linear-gradient(90deg,#FFC24A,#F5852E);color:#3A1D00;border-radius:999px;padding:.05rem .8rem;font-family:'M PLUS Rounded 1c',sans-serif;font-weight:800;letter-spacing:.08em}
h1{font-weight:900;font-size:clamp(2.1rem,9vw,3.3rem);line-height:1.25;margin:1rem 0 .3rem;text-shadow:0 4px 18px rgba(0,0,0,.4)}
h1 em{font-style:normal;display:block;background:var(--goldtx);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 10px rgba(0,0,0,.35))}
.h-desc{font-size:.92rem;opacity:.93;max-width:36em}
.layers{display:flex;gap:.45rem;flex-wrap:wrap;margin:.8rem 0 0}
.layers span{font-size:.78rem;font-weight:900;border-radius:999px;padding:.08rem .8rem;color:#fff}
.dial-flex{display:flex;gap:1.6rem;align-items:center;flex-wrap:wrap;margin-top:1.4rem}
.dial-box{flex:0 0 auto;margin:0 auto}
svg.dial{display:block;width:min(330px,84vw);height:auto;filter:drop-shadow(0 0 18px rgba(233,185,73,.35))}
.dial-legend{flex:1;min-width:220px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.28);border-radius:var(--r);padding:1rem 1.15rem;backdrop-filter:blur(8px);font-size:.86rem}
.dial-legend p{margin-bottom:.4rem}
.dial-legend p:last-child{margin-bottom:0}
.dial-legend .k{font-weight:900;color:#FFE08A}
.sector{fill:rgba(255,255,255,.08);stroke:#241A5A;stroke-width:1.5;cursor:pointer;transition:fill .18s}
.sector:hover{fill:rgba(255,255,255,.2)}
.sector.has{fill:#6B52D6}
.sector.has:hover{fill:#8569F0}
.sector.on{fill:#F0703A}
.dir-label{font-family:var(--mono);font-size:11px;fill:#D9D2F5;text-anchor:middle;pointer-events:none}
.dir-label.on{fill:#FFE08A;font-weight:600}
.dial-center{font-family:var(--serif);font-weight:800;font-size:22px;fill:#FFE08A;text-anchor:middle;letter-spacing:.1em}
.dial-center-sub{font-family:var(--mono);font-size:8.5px;fill:#C9C1EA;text-anchor:middle;letter-spacing:.12em}

/* フィルタ */
.filters{max-width:960px;margin:1.4rem auto 0;padding:0 1rem;display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.f-label{font-size:.8rem;color:var(--dim);font-weight:900}
.chip{border:none;background:#F1ECFF;border-radius:999px;padding:.25rem .9rem;font-size:.82rem;font-weight:700;cursor:pointer;font-family:var(--round);color:var(--purple);transition:all .15s}
.chip:hover{background:#E2D8FF}
.chip.on{background:var(--grad);color:#fff}
.chip:focus-visible,.sector:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.search{flex:1 1 100%;border:2px solid #EADBC6;border-radius:999px;padding:.6rem 1.1rem;font-size:.9rem;background:#fff;font-family:var(--round);margin-top:.3rem}
.search:focus{outline:none;border-color:var(--purple)}
.clear-btn{background:none;border:none;font-size:.82rem;font-weight:900;color:var(--orange);cursor:pointer;display:none;font-family:var(--round)}
.clear-btn.show{display:inline}

/* ログ */
main{max-width:960px;margin:1.3rem auto 3rem;padding:0 1rem}
.count{font-size:.8rem;color:var(--dim);margin-bottom:.9rem;font-family:var(--mono)}
#list{display:grid;gap:1.1rem}
@media(min-width:820px){#list{grid-template-columns:1fr 1fr}}
article.log{background:#fff;border:1.5px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 8px 22px rgba(120,90,50,.1);display:flex;flex-direction:column}
.log-head{position:relative;padding:1.1rem 1.25rem .95rem;color:#fff;background:
  radial-gradient(circle at 85% 20%,rgba(255,255,255,.4) 0 1.5px,transparent 2px),
  radial-gradient(circle at 70% 70%,rgba(255,255,255,.3) 0 1px,transparent 1.5px),
  radial-gradient(circle at 92% 60%,rgba(255,255,255,.35) 0 1px,transparent 1.5px),
  linear-gradient(140deg,#3B2A8C,#7A3A9E 70%,#C2553E)}
.log-date{font-family:var(--mono);font-size:.76rem;opacity:.85}
.log-title{font-weight:900;font-size:1.18rem;margin-top:.15rem;line-height:1.55}
.log-tags{margin-top:.55rem;display:flex;gap:.35rem;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:900;padding:.05rem .7rem;border-radius:999px}
.tag.band{background:rgba(255,255,255,.92);color:var(--purple)}
.tag.deity{background:#FFE08A;color:#5A3300}
.tag.layer{color:#fff;font-family:'M PLUS Rounded 1c',sans-serif}
.tag.layer.l1{background:#2E6BE6}.tag.layer.l2{background:#E58A12}.tag.layer.l3{background:#D94457}

table.spec{width:100%;border-collapse:collapse;font-size:.86rem}
table.spec th{width:7.5em;text-align:left;font-weight:900;color:var(--dim);padding:.5rem 1.25rem;border-bottom:1.5px dashed #F1E6D6;background:#FFF8EE;vertical-align:top;white-space:nowrap}
table.spec td{padding:.5rem 1rem .5rem .6rem;border-bottom:1.5px dashed #F1E6D6;vertical-align:top}
table.spec tr:last-child th,table.spec tr:last-child td{border-bottom:none}
.v-num{font-family:var(--mono);font-size:.92em}
.v-bearing{font-family:var(--mono);color:var(--purple);font-weight:600}
.v-deity{font-weight:900}
.todo{color:var(--red);font-size:.78em;font-weight:900;background:#FFECEE;border-radius:999px;padding:0 .6em}

.log-body{padding:1rem 1.25rem .6rem;font-size:.9rem;color:#3E3852;flex:1}
.log-body .memo-label{display:inline-block;font-size:.72rem;font-weight:900;color:#fff;background:var(--orange);border-radius:999px;padding:0 .7rem;margin-bottom:.35rem}
.log-foot{padding:.4rem 1.25rem 1.2rem}
.note-link{display:block;text-align:center;font-size:.9rem;font-weight:900;color:#fff;text-decoration:none;background:var(--grad);border-radius:999px;padding:.65rem;box-shadow:0 6px 16px rgba(164,75,184,.3)}

.r-photos{display:flex;gap:.5rem;flex-wrap:wrap;padding:.2rem 1.25rem .4rem}
.r-photos figure{margin:0;width:110px}
.r-photos img{width:110px;height:82px;object-fit:cover;border-radius:14px;cursor:pointer;display:block;transition:transform .15s}
.r-photos img:hover{transform:scale(1.03)}
.r-photos figcaption{font-size:.66rem;color:var(--dim);line-height:1.5;margin-top:.15rem}
.r-files{display:flex;gap:.6rem;flex-wrap:wrap;padding:0 1.25rem .3rem}
.r-file{font-size:.78rem;font-weight:700;color:var(--purple);text-decoration:none;border:1.5px solid #E2D8FF;border-radius:999px;padding:.12rem .8rem;background:#F7F4FF}
.r-file::before{content:"📄 "}
.lightbox{position:fixed;inset:0;background:rgba(18,14,46,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:.7rem;z-index:60;padding:1rem;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:80vh;border-radius:14px}
.lb-cap{color:#E2DCF8;font-size:.85rem;text-align:center}
.lb-x{color:#9A92BA;font-size:.7rem;letter-spacing:.2em}
.empty{padding:3rem 1rem;text-align:center;color:var(--dim);font-size:.9rem;background:#fff;border-radius:var(--r);border:1.5px dashed #EADBC6}
.empty b{font-weight:900;color:var(--ink)}

footer{background:var(--night);padding:1.8rem 1.2rem 2.2rem;text-align:center;font-size:.82rem;color:#B9B2D6;margin-top:2rem;border-radius:28px 28px 0 0}
footer a{color:#E2DCF8;font-weight:700}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(250,244,236,.96);backdrop-filter:blur(10px);border-top:1px solid #E8DCCB;padding:.35rem .2rem calc(.35rem + env(safe-area-inset-bottom))}
nav.tabs a{text-decoration:none;text-align:center;font-size:.7rem;font-weight:900;color:var(--dim);line-height:1.3}
nav.tabs a span{display:block;font-size:1.45rem}
nav.tabs a.on{color:var(--purple)}
.up{position:fixed;right:14px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:44;width:52px;height:52px;border-radius:50%;
  background:var(--grad);color:#fff;font-size:1.5rem;font-weight:900;display:grid;place-items:center;text-decoration:none;box-shadow:0 8px 20px rgba(140,60,180,.4)}
@media(min-width:900px){body{padding-bottom:0}nav.tabs,.up{display:none}}
@media(max-width:560px){table.spec th{width:6.5em;padding:.5rem .9rem}.log-head,.log-body{padding-left:1rem;padding-right:1rem}}
</style>
</head>

    <h1>地震ログ<em>震源は、<br>どの方位から。</em></h1>
    <p class="h-desc">天城（34.920°N / 139.018°E）を原点とする16方位モデルで震源方位を記録する観測ログ。三層を厳密に区別して記述する。</p>
    <div class="layers"><span style="background:#2E6BE6">L1＝計算・記録</span><span style="background:#E58A12">L2＝観測パターン</span><span style="background:#D94457">L3＝仮説</span></div>
    <div class="dial-flex">
      <div class="dial-box">
        <svg class="dial" viewBox="0 0 320 320" role="group" aria-label="16方位フィルタ盤" id="dial"></svg>

      <div class="dial-legend">
        <p>🧭 <span class="k">方位盤</span>の扇をタップすると、その方位帯のログだけを表示します。</p>
        <p>紫の扇＝ログのある方位帯。<span class="k" style="color:#FFB25A">オレンジ</span>＝選択中。もう一度タップで解除。</p>

    </div>

<div class="filters" id="deityFilters">
  <span class="f-label">神別：</span>
  <!-- 神チップはJSが生成 -->
  <input class="search" id="q" type="search" placeholder="🔍 検索（震源・語句）" aria-label="ログを検索">

</div>

<script src="data.js"></script>
<script>
/* ログデータは data.js（共有データファイル）で管理する */

/* ── 星空 ── */
(function(){
  let s="";
  for(let i=0;i<70;i++){
    const x=Math.random()*100, y=Math.random()*100, r=Math.random()*1.2+.3, o=(Math.random()*.6+.3).toFixed(2);
    s+=`<circle cx="${x}%" cy="${y}%" r="${r}" fill="#fff" opacity="${o}"><animate attributeName="opacity" values="${o};.12;${o}" dur="${(Math.random()*4+3).toFixed(1)}s" repeatCount="indefinite"/></circle>`;
  }
  document.getElementById("stars").innerHTML=s;
})();

/* ── 16方位 ── */
const DIRS = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
const state = { band:null, deity:null, q:"" };

/* ── 方位盤SVG生成 ── */
(function buildDial(){
  const svg = document.getElementById("dial");
  const cx=160, cy=160, r1=62, r2=132, rl=148;
  const has = new Set(LOGS.map(l=>l.band));
  let out = "";
  DIRS.forEach((d,i)=>{
    const a0 = (i*22.5 - 11.25 - 90) * Math.PI/180;
    const a1 = (i*22.5 + 11.25 - 90) * Math.PI/180;
    const p = (r,a)=>[cx+r*Math.cos(a), cy+r*Math.sin(a)];
    const [x0,y0]=p(r2,a0),[x1,y1]=p(r2,a1),[x2,y2]=p(r1,a1),[x3,y3]=p(r1,a0);
    out += `<path class="sector${has.has(d)?" has":""}" data-band="${d}" tabindex="0" role="button"
      aria-label="${d} 方位帯で絞り込み"
      d="M${x0},${y0} A${r2},${r2} 0 0 1 ${x1},${y1} L${x2},${y2} A${r1},${r1} 0 0 0 ${x3},${y3} Z"/>`;
    const am = (i*22.5 - 90) * Math.PI/180;
    const [lx,ly]=p(rl,am);
    out += `<text class="dir-label" data-band="${d}" x="${lx}" y="${ly+4}">${d}</text>`;
  });
  out += `<circle cx="${cx}" cy="${cy}" r="${r1-8}" fill="#171236" stroke="#E9B949" stroke-width="1.5" />`;
  out += `<text class="dial-center" x="${cx}" y="${cy+2}">天城</text>`;
  out += `<text class="dial-center-sub" x="${cx}" y="${cy+20}">34.920N 139.018E</text>`;
  svg.innerHTML = out;
  svg.querySelectorAll(".sector").forEach(s=>{
    const act = ()=>{ state.band = (state.band===s.dataset.band) ? null : s.dataset.band; render(); };
    s.addEventListener("click",act);
    s.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();act();} });
  });
})();

/* ── 神チップ生成 ── */
(function buildDeity(){
  const box = document.getElementById("deityFilters");
  const search = document.getElementById("q");
  const deities = [...new Set(LOGS.flatMap(l=>l.deities))];
  deities.forEach(d=>{
    const b=document.createElement("button");
    b.className="chip"; b.textContent=d; b.dataset.deity=d;
    b.addEventListener("click",()=>{ state.deity = (state.deity===d)?null:d; render(); });
    box.insertBefore(b,search);
  });
})();

document.getElementById("q").addEventListener("input",e=>{ state.q=e.target.value.trim(); render(); });
document.getElementById("clearBtn").addEventListener("click",()=>{
  state.band=null; state.deity=null; state.q="";
  document.getElementById("q").value=""; render();
});

/* ── 値の整形（■要確認 → 朱枠） ── */
function fmt(v, cls){
  if(!v) return `<span class="todo">未入力</span>`;
  if(String(v).includes("■要確認")) return `<span class="todo">要確認</span>` + String(v).replace("■要確認","").replace(/^（|）$/g,"") ;
  return cls ? `<span class="${cls}">${v}</span>` : v;
}

/* ── 描画 ── */
function render(){
  const list=document.getElementById("list");
  const rows = LOGS.filter(l=>
    (!state.band  || l.band===state.band) &&
    (!state.deity || l.deities.includes(state.deity)) &&
    (!state.q || (l.title+l.epicenter+l.memo+l.bearing).includes(state.q))
  );
  document.getElementById("count").textContent =
    `${rows.length} 件` + (state.band?` ／ 方位帯: ${state.band}`:"") + (state.deity?` ／ 神: ${state.deity}`:"");
  document.querySelectorAll(".sector").forEach(s=>s.classList.toggle("on", s.dataset.band===state.band));
  document.querySelectorAll(".dir-label").forEach(t=>t.classList.toggle("on", t.dataset.band===state.band));
  document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on", c.dataset.deity===state.deity));
  document.getElementById("clearBtn").classList.toggle("show", !!(state.band||state.deity||state.q));

  if(!rows.length){
    list.innerHTML = `<div class="empty"><b>該当するログはありません。</b><br>方位盤か絞り込みを解除してください。</div>`;
    return;
  }
  list.innerHTML = rows.map(l=>`
    <article class="log">
      <div class="log-head">
        <div class="log-date">${l.date}</div>
        <div class="log-title">${l.title}</div>
        <div class="log-tags">
          <span class="tag band">方位帯 ${l.band}</span>
          ${l.deities.map(d=>`<span class="tag deity">${d}</span>`).join("")}
          <span class="tag layer ${l.layer.toLowerCase()}">${l.layer}</span>
        </div>
      </div>
      <table class="spec">
        <tr><th>発生日</th><td><span class="v-num">${l.date}</span></td></tr>
        <tr><th>震源</th><td>${fmt(l.epicenter)}</td></tr>
        <tr><th>規模</th><td>${fmt(l.mag,"v-num")}</td></tr>
        <tr><th>深さ</th><td>${fmt(l.depth,"v-num")}</td></tr>
        <tr><th>天城方位</th><td>${fmt(l.bearing,"v-bearing")}</td></tr>
        <tr><th>対応神</th><td>${l.deities.map(d=>`<span class="v-deity">${d}</span>`).join("・")}</td></tr>
        <tr><th>記述層</th><td><span class="tag layer ${l.layer.toLowerCase()}">${l.layer}</span></td></tr>
      </table>
      <div class="log-body">
        <span class="memo-label">MEMO</span>
        ${l.memo}
      </div>
      ${l.photos && l.photos.length ? `<div class="r-photos">${l.photos.map(p=>`
        <figure><img src="${p.src}" alt="${p.cap||""}" loading="lazy" data-cap="${p.cap||""}">${p.cap?`<figcaption>${p.cap}</figcaption>`:""}</figure>`).join("")}</div>` : ""}
      ${l.files && l.files.length ? `<div class="r-files">${l.files.map(f=>`
        <a class="r-file" href="${f.href}" target="_blank" rel="noopener">${f.label||"添付資料"}</a>`).join("")}</div>` : ""}
      <div class="log-foot">
        <a class="note-link" href="${l.note}" target="_blank" rel="noopener">本文をnoteで読む →</a>
      </div>
    </article>
  `).join("");
}
render();

/* ── 写真ライトボックス ── */
const lb=document.getElementById("lightbox");
document.getElementById("list").addEventListener("click",e=>{
  const img=e.target.closest(".r-photos img"); if(!img) return;
  document.getElementById("lbImg").src=img.src;
  document.getElementById("lbCap").textContent=img.dataset.cap||"";
  lb.classList.add("on");
});
lb.addEventListener("click",()=>lb.classList.remove("on"));
document.addEventListener("keydown",e=>{ if(e.key==="Escape") lb.classList.remove("on"); });
</script>
</body>
</html>
